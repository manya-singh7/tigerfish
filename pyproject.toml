[project]
name = "tigerfish"
version = "0.1.0"
description = "An accuracy checker for Indian Environmental Impact Assessment reports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "streamlit==1.66.1",
    "openai==3.37.0",
    "python-dotenv==1.2.4",
    "PyMuPDF==2.0",
    "requests==2.34.2",
    "python-docx==1.2.0",
    "altair==6.3.0",
    "plotly==7.1.0",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "playwright==1.64.1",  # Browser checks: uv run playwright install chromium
    "kaleido==1.5.0",  # PNG export in scripts/species_map.py
    "tavily-python==0.8.5",  # Web-backed audit scripts
]

[tool.uv]
package = false
