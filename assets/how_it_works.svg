<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2118" width="720" height="2118" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="TigerFish pipeline diagram">
<title>How TigerFish works</title>
<rect width="720" height="2118" fill="#F7FBFA"/>
<svg x="32" y="30" width="84" height="84" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tf-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F4C57"/>
      <stop offset="1" stop-color="#082A33"/>
    </linearGradient>
    <linearGradient id="tf-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FD4C6"/>
      <stop offset="1" stop-color="#1FA39A"/>
    </linearGradient>
    <clipPath id="tf-body-clip">
      <path d="M402 256 C352 156 222 150 162 256 C222 362 352 356 402 256 Z"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tf-water)"
        stroke="#1FA39A" stroke-opacity="0.55" stroke-width="6"/>
  <!-- light rays from the surface -->
  <path d="M150 8 L210 8 L120 504 L80 504 Z" fill="#E6F7F4" opacity="0.05"/>
  <path d="M290 8 L320 8 L250 504 L225 504 Z" fill="#E6F7F4" opacity="0.04"/>
  <g transform="translate(256 258) scale(1.12) translate(-272 -250)">
    <!-- tail -->
    <path d="M176 256 L92 176 Q118 256 92 336 Z" fill="#5FD4C6"
          stroke="#082A33" stroke-width="10" stroke-linejoin="round"/>
    <!-- dorsal and belly fins -->
    <path d="M250 175 Q282 128 330 150 Q300 160 292 182 Z" fill="#5FD4C6"
          stroke="#082A33" stroke-width="8" stroke-linejoin="round"/>
    <path d="M262 334 Q284 368 318 360 Q300 348 298 330 Z" fill="#5FD4C6"
          stroke="#082A33" stroke-width="8" stroke-linejoin="round"/>
    <!-- body -->
    <path d="M402 256 C352 156 222 150 162 256 C222 362 352 356 402 256 Z"
          fill="url(#tf-body)"/>
    <!-- tiger stripes, clipped to the body -->
    <g clip-path="url(#tf-body-clip)" fill="none" stroke="#082A33"
       stroke-width="15" stroke-linecap="round">
      <path d="M208 190 Q194 256 208 322"/>
      <path d="M248 172 Q232 256 248 340"/>
      <path d="M288 174 Q274 230 282 262"/>
    </g>
    <path d="M402 256 C352 156 222 150 162 256 C222 362 352 356 402 256 Z"
          fill="none" stroke="#082A33" stroke-width="10" stroke-linejoin="round"/>
    <!-- magnifier handle -->
    <path d="M326 262 L296 296" stroke="#082A33" stroke-width="16" stroke-linecap="round"/>
    <!-- lens eye -->
    <circle cx="346" cy="238" r="31" fill="#E6F7F4" stroke="#082A33" stroke-width="11"/>
    <circle cx="353" cy="238" r="10" fill="#082A33"/>
    <path d="M330 224 A20 20 0 0 1 344 216" fill="none" stroke="#F2B544"
          stroke-width="6" stroke-linecap="round"/>
    <!-- bubbles -->
    <circle cx="430" cy="196" r="10" fill="none" stroke="#5FD4C6" stroke-width="6"/>
    <circle cx="452" cy="160" r="6" fill="none" stroke="#5FD4C6" stroke-width="5"/>
  </g></svg>
<text x="134" y="68" font-size="34" font-weight="700" fill="#0F4C57">How TigerFish works</text>
<text x="134" y="102" font-size="21" fill="#3E6670">From an EIA report to checked, quotable flags</text>
<rect x="32" y="150" width="656" height="108" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="56" y="190" font-size="26" font-weight="700" fill="#12303A">1  EIA report (PDF)</text>
<text x="56" y="224" font-size="21" fill="#2E4F58">Hundreds of pages: text, scans, tables, maps</text>
<line x1="360.0" y1="258" x2="360.0" y2="292" stroke="#0F5E5E" stroke-width="4"/><path d="M349.0 288 L360.0 304 L371.0 288 Z" fill="#0F5E5E"/>
<rect x="32" y="304" width="656" height="140" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="56" y="344" font-size="26" font-weight="700" fill="#12303A">2  Read every page</text>
<rect x="396.0" y="320" width="272.0" height="34" rx="17" fill="#0F5E5E"/><text x="532.0" y="344" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lightning · Super-VL</text>
<text x="56" y="378" font-size="21" fill="#2E4F58">Text pages: text layer, read by Lightning</text>
<text x="56" y="408" font-size="21" fill="#2E4F58">Scans, tables, maps: Super-VL looks at the image</text>
<line x1="360.0" y1="444" x2="360.0" y2="478" stroke="#0F5E5E" stroke-width="4"/><path d="M349.0 474 L360.0 490 L371.0 474 Z" fill="#0F5E5E"/>
<rect x="32" y="490" width="656" height="108" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="56" y="530" font-size="26" font-weight="700" fill="#12303A">3  Extract claims</text>
<rect x="533.5" y="506" width="134.5" height="34" rx="17" fill="#0F5E5E"/><text x="600.75" y="530" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lightning</text>
<text x="56" y="564" font-size="21" fill="#2E4F58">Each factual statement, with its page number</text>
<line x1="360.0" y1="598" x2="360.0" y2="632" stroke="#0F5E5E" stroke-width="4"/><path d="M349.0 628 L360.0 644 L371.0 628 Z" fill="#0F5E5E"/>
<rect x="32" y="644" width="656" height="140" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="56" y="684" font-size="26" font-weight="700" fill="#12303A">4  Pair claims</text>
<text x="56" y="718" font-size="21" fill="#2E4F58">Match statements on the same topic</text>
<text x="56" y="748" font-size="21" fill="#2E4F58">that could disagree with each other</text>
<line x1="360.0" y1="784" x2="360.0" y2="818" stroke="#0F5E5E" stroke-width="4"/><path d="M349.0 814 L360.0 830 L371.0 814 Z" fill="#0F5E5E"/>
<rect x="32" y="830" width="656" height="108" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="56" y="870" font-size="26" font-weight="700" fill="#12303A">5  Triage</text>
<rect x="533.5" y="846" width="134.5" height="34" rx="17" fill="#0F5E5E"/><text x="600.75" y="870" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lightning</text>
<text x="56" y="904" font-size="21" fill="#2E4F58">Quickly drop pairs that clearly agree</text>
<line x1="360.0" y1="938" x2="360.0" y2="972" stroke="#0F5E5E" stroke-width="4"/><path d="M349.0 968 L360.0 984 L371.0 968 Z" fill="#0F5E5E"/>
<rect x="32" y="984" width="656" height="140" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="56" y="1024" font-size="26" font-weight="700" fill="#12303A">6  Verdicts</text>
<rect x="583.5" y="1000" width="84.5" height="34" rx="17" fill="#0F5E5E"/><text x="625.75" y="1024" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ultra</text>
<text x="56" y="1058" font-size="21" fill="#2E4F58">Read both passages in full; decide</text>
<text x="56" y="1088" font-size="21" fill="#2E4F58">contradiction or not, and say why</text>
<rect x="20" y="1170" width="680" height="352" rx="22" fill="#EAF6F4" stroke="#1FA39A" stroke-width="2" stroke-dasharray="8 7"/><text x="44" y="1210" font-size="24" font-weight="700" fill="#12303A">Side checks (run in parallel with steps 2–6)</text>
<rect x="44" y="1234" width="304" height="132" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="68" y="1274" font-size="26" font-weight="700" fill="#12303A">Species</text>
<text x="68" y="1308" font-size="21" fill="#2E4F58">GBIF records vs.</text>
<text x="68" y="1338" font-size="21" fill="#2E4F58">species the report lists</text>
<rect x="372" y="1234" width="304" height="132" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="396" y="1274" font-size="26" font-weight="700" fill="#12303A">Web evidence</text>
<text x="396" y="1308" font-size="21" fill="#2E4F58">Tavily search +</text>
<text x="396" y="1338" font-size="21" fill="#2E4F58">paper trail (ToR, EC)</text>
<rect x="44" y="1386" width="304" height="132" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="68" y="1426" font-size="26" font-weight="700" fill="#12303A">Accreditation</text>
<text x="68" y="1460" font-size="21" fill="#2E4F58">Is the consultant</text>
<text x="68" y="1490" font-size="21" fill="#2E4F58">NABET-accredited?</text>
<rect x="372" y="1386" width="304" height="132" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="396" y="1426" font-size="26" font-weight="700" fill="#12303A">ToR promises</text>
<text x="396" y="1460" font-size="21" fill="#2E4F58">Did the report do</text>
<text x="396" y="1490" font-size="21" fill="#2E4F58">what the ToR asked?</text>
<line x1="360.0" y1="1124" x2="360.0" y2="1158" stroke="#0F5E5E" stroke-width="4"/><path d="M349.0 1154 L360.0 1170 L371.0 1154 Z" fill="#0F5E5E"/>
<line x1="360.0" y1="1522" x2="360.0" y2="1556" stroke="#0F5E5E" stroke-width="4"/><path d="M349.0 1552 L360.0 1568 L371.0 1552 Z" fill="#0F5E5E"/>
<rect x="32" y="1568" width="656" height="140" rx="18" fill="#FFF7E6" stroke="#F2B544" stroke-width="2.5"/>
<text x="56" y="1608" font-size="26" font-weight="700" fill="#12303A">7  Flags</text>
<text x="56" y="1642" font-size="21" fill="#2E4F58">Each one quotes the report, with page</text>
<text x="56" y="1672" font-size="21" fill="#2E4F58">numbers, so anyone can check it</text>
<line x1="360.0" y1="1708" x2="360.0" y2="1742" stroke="#0F5E5E" stroke-width="4"/><path d="M349.0 1738 L360.0 1754 L371.0 1738 Z" fill="#0F5E5E"/>
<rect x="32" y="1754" width="656" height="108" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="56" y="1794" font-size="26" font-weight="700" fill="#12303A">8  Human review</text>
<text x="56" y="1828" font-size="21" fill="#2E4F58">A person confirms or rejects every flag</text>
<line x1="360.0" y1="1862" x2="360.0" y2="1896" stroke="#0F5E5E" stroke-width="4"/><path d="M349.0 1892 L360.0 1908 L371.0 1892 Z" fill="#0F5E5E"/>
<rect x="32" y="1908" width="656" height="140" rx="18" fill="#FFFFFF" stroke="#1FA39A" stroke-width="2.5"/>
<text x="56" y="1948" font-size="26" font-weight="700" fill="#12303A">9  Letter / RTI pack</text>
<text x="56" y="1982" font-size="21" fill="#2E4F58">Objection letter and RTI requests,</text>
<text x="56" y="2012" font-size="21" fill="#2E4F58">built only from confirmed flags</text>
<text x="32" y="2084" font-size="18" fill="#3E6670">Models: Nemotron Lightning (fast reading), Super-VL (images),</text><text x="32" y="2108" font-size="18" fill="#3E6670">Ultra (final verdicts). Nothing is sent until a person approves it.</text>
</svg>
