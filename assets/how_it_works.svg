<svg xmlns="http://www.w3.org/2000/svg" class="tf-diagram" viewBox="0 0 720 1328" role="img" aria-label="How TigerFish works: from the PDF to flags a person checks"><style>.d-box{fill:#F2ECDF;stroke:#0D4242;stroke-width:1}.d-key{stroke-width:2}.d-dash{fill:none;stroke:#5C6564;stroke-width:1;stroke-dasharray:5 5}.d-line,.d-head{fill:none;stroke:#0D4242;stroke-width:1.5}.d-title{font:600 22px Newsreader,Georgia,serif;fill:#17302F}.d-body{font:400 17px 'Schibsted Grotesk',Arial,sans-serif;fill:#5C6564}.d-model{font:500 15px 'IBM Plex Mono',Consolas,monospace;fill:#0D4242}</style><rect width="720" height="1328" fill="#F2ECDF"/><rect class="d-box" x="20" y="20" width="680" height="80" rx="3"/><text class="d-title" x="40" y="54">EIA report (PDF)</text><text class="d-body" x="40" y="82">Hundreds of pages: text, scans, tables, maps</text><line class="d-line" x1="360.0" y1="100" x2="360.0" y2="132"/><path class="d-head" d="M354.0 124 L360.0 134 L366.0 124"/><rect class="d-box" x="20" y="134" width="680" height="106" rx="3"/><text class="d-title" x="40" y="168">Read every page</text><text class="d-model" x="680" y="168" text-anchor="end">Lightning, Super-VL</text><text class="d-body" x="40" y="196">Text pages: the text layer, read by Lightning</text><text class="d-body" x="40" y="222">Scans, tables, maps: Super-VL reads the image</text><line class="d-line" x1="360.0" y1="240" x2="360.0" y2="272"/><path class="d-head" d="M354.0 264 L360.0 274 L366.0 264"/><rect class="d-box" x="20" y="274" width="680" height="80" rx="3"/><text class="d-title" x="40" y="308">Extract claims</text><text class="d-model" x="680" y="308" text-anchor="end">Lightning</text><text class="d-body" x="40" y="336">Each factual statement, with its page number</text><line class="d-line" x1="360.0" y1="354" x2="360.0" y2="386"/><path class="d-head" d="M354.0 378 L360.0 388 L366.0 378"/><rect class="d-box" x="20" y="388" width="680" height="80" rx="3"/><text class="d-title" x="40" y="422">Pair claims</text><text class="d-body" x="40" y="450">Statements on the same topic that could disagree</text><line class="d-line" x1="360.0" y1="468" x2="360.0" y2="500"/><path class="d-head" d="M354.0 492 L360.0 502 L366.0 492"/><rect class="d-box" x="20" y="502" width="680" height="80" rx="3"/><text class="d-title" x="40" y="536">Triage</text><text class="d-model" x="680" y="536" text-anchor="end">Lightning</text><text class="d-body" x="40" y="564">Drop pairs that clearly agree</text><line class="d-line" x1="360.0" y1="582" x2="360.0" y2="614"/><path class="d-head" d="M354.0 606 L360.0 616 L366.0 606"/><rect class="d-box" x="20" y="616" width="680" height="80" rx="3"/><text class="d-title" x="40" y="650">Verdicts</text><text class="d-model" x="680" y="650" text-anchor="end">Ultra</text><text class="d-body" x="40" y="678">Read both passages in full; decide and say why</text><line class="d-line" x1="360.0" y1="696" x2="360.0" y2="728"/><path class="d-head" d="M354.0 720 L360.0 730 L366.0 720"/><rect class="d-dash" x="8" y="722" width="704" height="244" rx="3"/><text class="d-title" x="20" y="754">Side checks, alongside the steps above</text><rect class="d-box" x="20.0" y="774" width="332.0" height="80" rx="3"/><text class="d-title" x="38.0" y="806">Species</text><text class="d-body" x="38.0" y="834">GBIF records against the species listed</text><rect class="d-box" x="368.0" y="774" width="332.0" height="80" rx="3"/><text class="d-title" x="386.0" y="806">Web evidence</text><text class="d-body" x="386.0" y="834">Tavily search and the paper trail</text><rect class="d-box" x="20.0" y="870" width="332.0" height="80" rx="3"/><text class="d-title" x="38.0" y="902">Accreditation</text><text class="d-body" x="38.0" y="930">Is the consultant NABET-accredited?</text><rect class="d-box" x="368.0" y="870" width="332.0" height="80" rx="3"/><text class="d-title" x="386.0" y="902">ToR promises</text><text class="d-body" x="386.0" y="930">Did the report do what the ToR asked?</text><line class="d-line" x1="360.0" y1="966" x2="360.0" y2="998"/><path class="d-head" d="M354.0 990 L360.0 1000 L366.0 990"/><rect class="d-box d-key" x="20" y="1000" width="680" height="80" rx="3"/><text class="d-title" x="40" y="1034">Flags</text><text class="d-body" x="40" y="1062">Each quotes the report with its page, so anyone can check it</text><line class="d-line" x1="360.0" y1="1080" x2="360.0" y2="1112"/><path class="d-head" d="M354.0 1104 L360.0 1114 L366.0 1104"/><rect class="d-box" x="20" y="1114" width="680" height="80" rx="3"/><text class="d-title" x="40" y="1148">Human review</text><text class="d-body" x="40" y="1176">A person confirms or rejects every flag</text><line class="d-line" x1="360.0" y1="1194" x2="360.0" y2="1226"/><path class="d-head" d="M354.0 1218 L360.0 1228 L366.0 1218"/><rect class="d-box" x="20" y="1228" width="680" height="80" rx="3"/><text class="d-title" x="40" y="1262">Letter and RTI pack</text><text class="d-body" x="40" y="1290">Built only from confirmed flags</text></svg>
