# TigerFish theme. Adopted: .streamlit/config.toml carries these sections.
# Change both files together. [theme.light] / [theme.dark] need Streamlit >= 1.46
# (requirements.txt pins 1.66.1). The user's light/dark setting picks a section.
#
# Palette comes from the logo (scripts/build_brand.py):
#   abyss #082A33 · deep #0F4C57 · teal #0F5E5E · reef #1FA39A
#   shallow #5FD4C6 · foam #E6F7F4 · sand #F2B544 (accent only)
#
# WCAG contrast, checked with the WCAG 2.x formula (AA: 4.5 text, 3.0 UI parts):
#   light  text/background 13.9   text/secondary 12.7
#          primary/background 7.5   white text on primary button 7.5
#   dark   text/background 15.3   text/secondary 13.4
#          primary/background 3.7 (UI 3.0 ok)   primary/secondary 3.3
#          white text on primary button 4.65   link/background 9.7
# Dark primary is deeper than the logo's bright teal on purpose: bright teal
# (#5FD4C6) under white button text is only 1.8:1, so it is used for links instead.

[theme]
font = "sans-serif"
# Optional web font (Streamlit >= 1.46 syntax), if you want Inter everywhere:
# font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
baseRadius = "medium"

[theme.light]
primaryColor = "#0F5E5E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF6F4"
textColor = "#12303A"
linkColor = "#0F5E5E"
borderColor = "#B9D9D4"

[theme.dark]
primaryColor = "#1B827A"
backgroundColor = "#0B1D22"
secondaryBackgroundColor = "#11292F"
textColor = "#E6F4F1"
linkColor = "#5FD4C6"
borderColor = "#2A4A52"
