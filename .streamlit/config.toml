# Theme from docs/DESIGN.md (palette sampled from assets/tigerfish_icon_source.png; contrast
# ratios listed there, all WCAG AA). The viewer's light/dark setting picks [theme.light] or
# [theme.dark]. Fonts are self-hosted in static/fonts/ (Streamlit serves only static/).
[server]
enableStaticServing = true
maxUploadSize = 100

[theme]
font = "Schibsted Grotesk, Noto Sans Devanagari, Noto Sans Tamil, Noto Sans Kannada, sans-serif"
headingFont = "Newsreader, Georgia, serif"
codeFont = "IBM Plex Mono, Consolas, monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontWeights = [600, 600, 500, 500, 500, 500]
headingFontSizes = ["2.5rem", "1.5rem", "1.125rem", "1rem", "1rem", "1rem"]
codeFontSize = "0.8125rem"
baseRadius = "3px"
buttonRadius = "3px"
showWidgetBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#0D4242"
backgroundColor = "#F6F2E9"
secondaryBackgroundColor = "#EFE9DC"
textColor = "#17302F"
linkColor = "#0D4242"
borderColor = "#DDD5C4"
dataframeBorderColor = "#DDD5C4"
codeBackgroundColor = "#EFE9DC"

[theme.dark]
primaryColor = "#8CC7BE"
backgroundColor = "#0F1716"
secondaryBackgroundColor = "#1C2827"
textColor = "#ECE5D6"
linkColor = "#8CC7BE"
borderColor = "#33403E"
dataframeBorderColor = "#33403E"
codeBackgroundColor = "#1C2827"

[[theme.fontFaces]]
family = "Newsreader"
url = "app/static/fonts/Newsreader-italic-400-600-latin-ext.woff2"
weight = "400 600"
style = "italic"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
